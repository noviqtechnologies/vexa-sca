name: 'Vexa SCA & Code Security (SAST + Secrets + Licenses + Dependency Firewall)'
description: 'Zero-Code-Sync Dependency SCA, AST Reachability, Multi-Language SAST, Secret Detection, License Compliance & Deduplicated PR Security Matrix.'
author: 'Vexa SCA Security'

branding:
  icon: 'shield'
  color: 'purple'

inputs:
  path:
    description: 'Path to target workspace directory'
    required: false
    default: '.'
  fail-on:
    description: 'Quality gate failure threshold (low, medium, high, critical, reachable, reachable-critical). Empty disables SCA threshold gating.'
    required: false
    default: 'high'
  fail-on-licenses:
    description: 'Quality gate failure threshold for license compliance (strong-copyleft, weak-copyleft, unknown). Empty disables license gating.'
    required: false
    default: ''
  reachable-only:
    description: 'Only report and evaluate vulnerabilities with confirmed AST execution reachability'
    required: false
    default: 'false'
  fail-on-reachable:
    description: 'Fail CI/CD quality gate if any vulnerability has confirmed AST reachability'
    required: false
    default: 'false'
  sast:
    description: 'Enable Zero-Code-Sync local SAST code security scanner'
    required: false
    default: 'true'
  secrets:
    description: 'Enable Zero-Code-Sync local secret & credential scanner'
    required: false
    default: 'true'
  ingest-sarif:
    description: 'Optional external SARIF v2.1.0 file to ingest with automatic code snippet stripping'
    required: false
    default: ''
  offline-db:
    description: 'Optional path to Ed25519-signed .vexadb offline advisory bundle for zero-network CI scans'
    required: false
    default: ''
  cache:
    description: 'Cache Vexa advisory/EPSS/KEV data across CI runs for sub-10s scans (true/false)'
    required: false
    default: 'true'
  sarif-file:
    description: 'Output path for OASIS SARIF v2.1.0 security report'
    required: false
    default: 'vexa-results.sarif'
  upload-sarif:
    description: 'Upload SARIF results to GitHub Code Scanning Security tab'
    required: false
    default: 'true'
  upload-facts:
    description: 'Stream Zero-Code-Retention .vexa.facts.json to Vexa SCA Cloud dashboard'
    required: false
    default: 'true'
  comment-pr:
    description: 'Post or update a deduplicated multi-engine security matrix comment on pull requests (true/false)'
    required: false
    default: 'true'
  github-token:
    description: 'GitHub token for posting or updating pull request comments'
    required: false
    default: ${{ github.token }}
  token:
    description: 'Vexa SCA Security API Key (vexasec_... or pass secret VEXA_SCA_SECURITY_API_KEY)'
    required: false
    default: ''
  api-url:
    description: 'Optional Vexa SCA Cloud API base URL override'
    required: false
    default: ''
  org:
    description: 'Target Vexa organization slug (e.g. codesecuredev-01)'
    required: false
    default: ''
  project:
    description: 'Target Vexa project name/slug override'
    required: false
    default: ''
  version:
    description: 'Vexa SCA CLI release tag to execute (latest, source, or a semver tag like v1.7.0)'
    required: false
    default: 'latest'

runs:
  using: 'composite'
  steps:
    - name: Validate Action Inputs
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_FAIL_ON_LICENSES: ${{ inputs.fail-on-licenses }}
        INPUT_REACHABLE_ONLY: ${{ inputs.reachable-only }}
        INPUT_FAIL_ON_REACHABLE: ${{ inputs.fail-on-reachable }}
        INPUT_SAST: ${{ inputs.sast }}
        INPUT_SECRETS: ${{ inputs.secrets }}
        INPUT_CACHE: ${{ inputs.cache }}
        INPUT_UPLOAD_SARIF: ${{ inputs.upload-sarif }}
        INPUT_UPLOAD_FACTS: ${{ inputs.upload-facts }}
        INPUT_COMMENT_PR: ${{ inputs.comment-pr }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        node "${ACTION_PATH}/.github/actions/validate-inputs.js"

    - name: Set up Vexa SCA Environment
      shell: bash
      env:
        # CWE-77 mitigation: inputs are passed via env vars, NOT interpolated into shell script.
        INPUT_PATH: ${{ inputs.path }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_API_URL: ${{ inputs.api-url }}
        INPUT_ORG: ${{ inputs.org }}
        INPUT_PROJECT: ${{ inputs.project }}
      run: |
        printf 'VEXA_SCA_PATH=%s\n' "${INPUT_PATH}" >> "$GITHUB_ENV"
        if [ -n "${INPUT_PROJECT}" ]; then
          printf 'VEXA_PROJECT=%s\n' "${INPUT_PROJECT}" >> "$GITHUB_ENV"
        fi
        if [ -n "${INPUT_TOKEN}" ]; then
          printf 'VEXA_SCA_SECURITY_API_KEY=%s\n' "${INPUT_TOKEN}" >> "$GITHUB_ENV"
          printf 'VEXA_SECURITY_API_KEY=%s\n' "${INPUT_TOKEN}" >> "$GITHUB_ENV"
          printf 'VEXA_TOKEN=%s\n' "${INPUT_TOKEN}" >> "$GITHUB_ENV"
        fi
        if [ -n "${INPUT_API_URL}" ]; then
          printf 'VEXA_API_URL=%s\n' "${INPUT_API_URL}" >> "$GITHUB_ENV"
          printf 'VEXA_API_BASE_URL=%s\n' "${INPUT_API_URL}" >> "$GITHUB_ENV"
        fi
        if [ -n "${INPUT_ORG}" ]; then
          printf 'VEXA_ORG=%s\n' "${INPUT_ORG}" >> "$GITHUB_ENV"
          printf 'VEXA_ORG_SLUG=%s\n' "${INPUT_ORG}" >> "$GITHUB_ENV"
        fi

    - name: Cache Vexa Advisory Intelligence
      if: inputs.cache == 'true' && inputs.offline-db == ''
      uses: actions/cache@5a3ec84eff668545956fd18022155c479e4e2c89 # v4.2.3
      with:
        path: ${{ runner.temp }}/vexa-cache
        key: vexa-sca-intel-${{ runner.os }}-${{ hashFiles('**/package-lock.json', '**/pnpm-lock.yaml', '**/yarn.lock', '**/uv.lock', '**/poetry.lock', '**/requirements.txt', '**/Cargo.lock', '**/go.sum', '**/pom.xml') }}
        restore-keys: |
          vexa-sca-intel-${{ runner.os }}-

    - name: Build Vexa SCA from Source
      if: inputs.version == 'source'
      shell: bash
      run: |
        cargo build --release --locked --bin vexa-sca
        printf '%s\n' "${PWD}/target/release" >> "$GITHUB_PATH"

    - name: Download & Install Vexa SCA CLI
      if: inputs.version != 'source'
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        if command -v vexa-sca &> /dev/null; then
          echo "vexa-sca is already available in PATH."
          exit 0
        fi

        VERSION="${INPUT_VERSION}"
        OS="${RUNNER_OS:-Linux}"
        ARCH="${RUNNER_ARCH:-X64}"

        case "$OS" in
          Linux)
            if [ "$ARCH" = "ARM64" ]; then
              ASSET="vexa-sca-linux-arm64.tar.gz"
            else
              ASSET="vexa-sca-linux-x86_64.tar.gz"
            fi
            ;;
          macOS)
            if [ "$ARCH" = "ARM64" ]; then
              ASSET="vexa-sca-darwin-arm64.tar.gz"
            else
              ASSET="vexa-sca-darwin-x86_64.tar.gz"
            fi
            ;;
          Windows)
            ASSET="vexa-sca-windows-x86_64.zip"
            ;;
          *)
            echo "::warning::Unrecognized runner OS: $OS. Skipping binary download."
            exit 0
            ;;
        esac

        INSTALL_DIR="${RUNNER_TEMP}/vexa-sca-bin"
        mkdir -p "$INSTALL_DIR"

        if [ "$VERSION" = "latest" ]; then
          DOWNLOAD_URL="https://github.com/noviqtechnologies/vexa-sca/releases/latest/download/${ASSET}"
        else
          DOWNLOAD_URL="https://github.com/noviqtechnologies/vexa-sca/releases/download/${VERSION}/${ASSET}"
        fi
        CHECKSUM_URL="${DOWNLOAD_URL}.sha256"
        ARCHIVE_PATH="${RUNNER_TEMP}/${ASSET}"
        CHECKSUM_PATH="${RUNNER_TEMP}/${ASSET}.sha256"
        echo "Downloading prebuilt Vexa SCA binary from $DOWNLOAD_URL..."

        SUCCESS=false
        if curl -sSL -f -o "$ARCHIVE_PATH" "$DOWNLOAD_URL"; then
          if ! curl -sSL -f -o "$CHECKSUM_PATH" "$CHECKSUM_URL"; then
            echo "::error::Failed to download required SHA-256 checksum ($CHECKSUM_URL); failing closed."
            exit 1
          fi
          EXPECTED_HASH=$(awk '{print $1}' "$CHECKSUM_PATH" | tr '[:upper:]' '[:lower:]' | head -n 1)
          if ! printf '%s' "$EXPECTED_HASH" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::Invalid SHA-256 digest in ${ASSET}.sha256; failing closed."
            exit 1
          fi

          if [ "$OS" = "Windows" ]; then
            ACTUAL_HASH=$(powershell -NoProfile -Command "(Get-FileHash -Algorithm SHA256 -LiteralPath '${ARCHIVE_PATH}').Hash.ToLowerInvariant()" | tr -d '\r\n')
          elif command -v sha256sum &> /dev/null; then
            ACTUAL_HASH=$(sha256sum "$ARCHIVE_PATH" | awk '{print $1}' | tr '[:upper:]' '[:lower:]')
          elif command -v shasum &> /dev/null; then
            ACTUAL_HASH=$(shasum -a 256 "$ARCHIVE_PATH" | awk '{print $1}' | tr '[:upper:]' '[:lower:]')
          elif command -v openssl &> /dev/null; then
            ACTUAL_HASH=$(openssl dgst -sha256 "$ARCHIVE_PATH" | awk '{print tolower($NF)}')
          else
            echo "::error::No SHA-256 verification tool available on runner; failing closed."
            exit 1
          fi

          if [ "$ACTUAL_HASH" != "$EXPECTED_HASH" ]; then
            echo "::error::SHA-256 verification failed for ${ASSET}! Expected ${EXPECTED_HASH}, got ${ACTUAL_HASH}."
            rm -f "$ARCHIVE_PATH" "$CHECKSUM_PATH"
            exit 1
          fi
          echo "SHA-256 verified (${ACTUAL_HASH})."

          if [ "$OS" = "Windows" ]; then
            if command -v unzip &> /dev/null; then
              unzip -q -o "$ARCHIVE_PATH" -d "$INSTALL_DIR" && SUCCESS=true
            else
              powershell -NoProfile -Command "Expand-Archive -LiteralPath '${ARCHIVE_PATH}' -DestinationPath '${INSTALL_DIR}' -Force" && SUCCESS=true
            fi
          else
            if tar -xzf "$ARCHIVE_PATH" -C "$INSTALL_DIR" 2>/dev/null; then
              chmod +x "$INSTALL_DIR/vexa-sca" 2>/dev/null || true
              chmod +x "$INSTALL_DIR/vexa" 2>/dev/null || true
              chmod +x "$INSTALL_DIR/sca" 2>/dev/null || true
              SUCCESS=true
            fi
          fi
        else
          echo "::warning::Release asset download failed for $DOWNLOAD_URL. Proceeding to fallback launchers."
        fi

        if [ "$SUCCESS" = "true" ]; then
          printf '%s\n' "$INSTALL_DIR" >> "$GITHUB_PATH"
          echo "Successfully installed Vexa SCA to $INSTALL_DIR"
        else
          echo "::warning::Release asset download failed for $DOWNLOAD_URL. Proceeding to fallback launchers."
        fi

    - name: Run Vexa Security Scan (SCA + Licenses + SAST + Secrets)
      shell: bash
      env:
        # CWE-77 mitigation: all user-controlled inputs routed through env vars.
        INPUT_PATH: ${{ inputs.path }}
        INPUT_SARIF_FILE: ${{ inputs.sarif-file }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_FAIL_ON_LICENSES: ${{ inputs.fail-on-licenses }}
        INPUT_REACHABLE_ONLY: ${{ inputs.reachable-only }}
        INPUT_FAIL_ON_REACHABLE: ${{ inputs.fail-on-reachable }}
        INPUT_SAST: ${{ inputs.sast }}
        INPUT_SECRETS: ${{ inputs.secrets }}
        INPUT_INGEST_SARIF: ${{ inputs.ingest-sarif }}
        INPUT_OFFLINE_DB: ${{ inputs.offline-db }}
        INPUT_CACHE: ${{ inputs.cache }}
        INPUT_UPLOAD_FACTS: ${{ inputs.upload-facts }}
        VEXA_CACHE_DIR: ${{ runner.temp }}/vexa-cache
        INPUT_API_URL: ${{ inputs.api-url }}
        INPUT_ORG: ${{ inputs.org }}
        INPUT_PROJECT: ${{ inputs.project }}
        VEXA_ORG: ${{ inputs.org }}
        VEXA_ORG_SLUG: ${{ inputs.org }}
        VEXA_PROJECT: ${{ inputs.project }}
        VEXA_API_URL: ${{ inputs.api-url }}
        VEXA_API_BASE_URL: ${{ inputs.api-url }}
        VEXA_SCA_SECURITY_API_KEY: ${{ inputs.token }}
        VEXA_SECURITY_API_KEY: ${{ inputs.token }}
        VEXA_TOKEN: ${{ inputs.token }}
        ACTION_PATH: ${{ github.action_path }}
        RUNNER_TEMP_DIR: ${{ runner.temp }}
      run: |
        PR_REPORT="${RUNNER_TEMP_DIR}/vexa-sca-pr-report.md"
        ARGS=("scan" "${INPUT_PATH}" "--sarif-file" "${INPUT_SARIF_FILE}" "--pr-comment-file" "${PR_REPORT}")

        if [ -n "${INPUT_FAIL_ON}" ]; then
          ARGS+=("--fail-on" "${INPUT_FAIL_ON}")
        fi

        if [ -n "${INPUT_FAIL_ON_LICENSES}" ]; then
          ARGS+=("--fail-on-licenses" "${INPUT_FAIL_ON_LICENSES}")
        fi

        if [ "${INPUT_REACHABLE_ONLY}" = "true" ]; then
          ARGS+=("--reachable-only")
        fi

        if [ "${INPUT_FAIL_ON_REACHABLE}" = "true" ]; then
          ARGS+=("--fail-on-reachable")
        fi

        if [ "${INPUT_SAST}" = "true" ]; then
          ARGS+=("--sast")
        fi

        if [ "${INPUT_SECRETS}" = "true" ]; then
          ARGS+=("--secrets")
        fi

        if [ -n "${INPUT_INGEST_SARIF}" ]; then
          ARGS+=("--ingest-sarif" "${INPUT_INGEST_SARIF}")
        fi

        if [ -n "${INPUT_OFFLINE_DB}" ]; then
          ARGS+=("--offline-db" "${INPUT_OFFLINE_DB}")
        fi

        if [ "${INPUT_UPLOAD_FACTS}" = "true" ]; then
          ARGS+=("--upload")
        fi

        if [ -n "${INPUT_API_URL}" ]; then
          ARGS+=("--api-url" "${INPUT_API_URL}")
        fi

        set +e
        if [ -n "$RUNNER_TEMP_DIR" ] && [ -x "$RUNNER_TEMP_DIR/vexa-sca-bin/vexa-sca" ]; then
          "$RUNNER_TEMP_DIR/vexa-sca-bin/vexa-sca" "${ARGS[@]}"
        elif [ -n "$RUNNER_TEMP_DIR" ] && [ -f "$RUNNER_TEMP_DIR/vexa-sca-bin/vexa-sca.exe" ]; then
          "$RUNNER_TEMP_DIR/vexa-sca-bin/vexa-sca.exe" "${ARGS[@]}"
        elif command -v vexa-sca &> /dev/null; then
          vexa-sca "${ARGS[@]}"
        elif [ -f "${ACTION_PATH}/bin/vexa-sca.js" ] && command -v node &> /dev/null; then
          node "${ACTION_PATH}/bin/vexa-sca.js" "${ARGS[@]}"
        elif [ -f "./bin/vexa-sca.js" ] && command -v node &> /dev/null; then
          node ./bin/vexa-sca.js "${ARGS[@]}"
        elif command -v cargo &> /dev/null; then
          cargo run --release --bin vexa-sca -- "${ARGS[@]}"
        else
          echo "Error: Neither vexa-sca binary, node launcher, nor cargo build toolchain found on runner."
          exit 1
        fi
        SCAN_EXIT_CODE=$?
        set -e

        printf 'VEXA_SCA_EXIT_CODE=%s\n' "${SCAN_EXIT_CODE}" >> "$GITHUB_ENV"

    - name: Upload SARIF to GitHub Code Scanning
      if: always() && inputs.upload-sarif == 'true' && hashFiles(inputs.sarif-file) != ''
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif-file }}
        category: 'vexa-sca'

    - name: Post or Update PR Comment
      if: always() && inputs.comment-pr == 'true' && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target')
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        VEXA_REPORT_PATH: ${{ runner.temp }}/vexa-sca-pr-report.md
        ACTION_PATH: ${{ github.action_path }}
      run: |
        node "${ACTION_PATH}/.github/actions/comment-pr.js"

    - name: Enforce Quality Gate
      if: always()
      shell: bash
      run: |
        if [ "${VEXA_SCA_EXIT_CODE:-1}" -ne 0 ]; then
          echo "::error::Vexa SCA security gate failed (exit code ${VEXA_SCA_EXIT_CODE:-1})."
          exit "${VEXA_SCA_EXIT_CODE:-1}"
        fi
