[package]
name = "vexa-core"
version = "1.5.2"
edition = "2021"
authors = ["Noviq Technologies <support@vexasec.io>"]
description = "Shared pure-Rust core security engine (CVSS v3/v4, OpenSSF MAL-* malware intel, Python lockfile graphs, single-pass JS/TS AST reachability) used by vexa-sca, vexa-arc, and vexa-sca-cloud."
license = "Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
oxc_allocator = "0.155.0"
oxc_parser = "0.155.0"
oxc_ast = "0.155.0"
oxc_span = "0.155.0"
oxc_ast_visit = "0.155.0"
rustpython-parser = "0.4.0"
