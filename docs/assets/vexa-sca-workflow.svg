<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <linearGradient id="wf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35" />
    </filter>
    <marker id="wf-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="wf-arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="wf-arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f43f5e" />
    </marker>
    <marker id="wf-arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="520" rx="16" fill="url(#wf-bg)" stroke="#1e293b" stroke-width="2"/>

  <!-- Title Badge & Header -->
  <rect x="40" y="24" width="130" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="105" y="41" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">WORKFLOW</text>
  <text x="40" y="78" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800">Post-Scan Remediation &amp; Quality Gate Lifecycle</text>
  <text x="40" y="100" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Deterministic CI/CD enforcement, reachability-based triage, automated patching, and policy management</text>

  <!-- Step 1: Scan Execution -->
  <g transform="translate(40, 140)" filter="url(#shadow)">
    <rect width="190" height="110" rx="10" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="14" y="14" width="70" height="20" rx="4" fill="#0369a1"/>
    <text x="49" y="28" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">STEP 1</text>
    <text x="14" y="55" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700">CI/CD Scan Trigger</text>
    <rect x="14" y="66" width="162" height="30" rx="4" fill="#0b0f19"/>
    <text x="22" y="85" fill="#38bdf8" font-family="monospace" font-size="9">vexa-sca scan --fail-on high</text>
  </g>

  <!-- Connect 1 -> Decision Gate -->
  <line x1="230" y1="195" x2="274" y2="195" stroke="#38bdf8" stroke-width="2" marker-end="url(#wf-arrow-blue)"/>

  <!-- Step 2: Quality Gate Decision Diamond / Box -->
  <g transform="translate(280, 140)" filter="url(#shadow)">
    <rect width="180" height="110" rx="10" fill="url(#card-grad)" stroke="#818cf8" stroke-width="1.5"/>
    <rect x="14" y="14" width="70" height="20" rx="4" fill="#4338ca"/>
    <text x="49" y="28" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">STEP 2</text>
    <text x="14" y="55" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700">Quality Gate Evaluation</text>
    <text x="14" y="74" fill="#94a3b8" font-family="sans-serif" font-size="10">Check exit codes:</text>
    <text x="14" y="92" fill="#34d399" font-family="monospace" font-size="9" font-weight="600">Exit 0: PASSED</text>
    <text x="100" y="92" fill="#fb7185" font-family="monospace" font-size="9" font-weight="600">Exit 1: FAILED</text>
  </g>

  <!-- Path A: Exit 0 (Success Path - Top Right) -->
  <path d="M 460 175 L 530 175" stroke="#10b981" stroke-width="2" marker-end="url(#wf-arrow-green)"/>
  <g transform="translate(535, 120)" filter="url(#shadow)">
    <rect width="385" height="100" rx="10" fill="url(#card-grad)" stroke="#10b981" stroke-width="1.5"/>
    <rect x="14" y="14" width="105" height="20" rx="4" fill="#065f46"/>
    <text x="66" y="28" fill="#34d399" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">GATE PASSED (0)</text>
    <text x="14" y="53" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700">Publish Deliverables &amp; Deploy to Production</text>
    <text x="14" y="72" fill="#94a3b8" font-family="sans-serif" font-size="10">1. Upload SARIF v2.1.0 to GitHub Security / GitLab SAST Code Scanning</text>
    <text x="14" y="88" fill="#94a3b8" font-family="sans-serif" font-size="10">2. Archive CycloneDX v1.5 / SPDX v2.3 SBOM with build release artifacts</text>
  </g>

  <!-- Path B: Exit 1 (Violated Path - Bottom) -->
  <path d="M 370 250 L 370 295" stroke="#f43f5e" stroke-width="2" marker-end="url(#wf-arrow-red)"/>

  <!-- Step 3: Reachability Triage -->
  <g transform="translate(265, 305)" filter="url(#shadow)">
    <rect width="210" height="175" rx="10" fill="url(#card-grad)" stroke="#f43f5e" stroke-width="1.5"/>
    <rect x="14" y="14" width="70" height="20" rx="4" fill="#9f1239"/>
    <text x="49" y="28" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">STEP 3</text>
    <text x="14" y="53" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700">AST Reachability Triage</text>
    <rect x="14" y="64" width="182" height="28" rx="4" fill="#0b0f19"/>
    <text x="20" y="82" fill="#38bdf8" font-family="monospace" font-size="8">vexa-sca scan --reachable-only</text>

    <text x="14" y="112" fill="#94a3b8" font-family="sans-serif" font-size="10">Are vulnerable functions</text>
    <text x="14" y="126" fill="#94a3b8" font-family="sans-serif" font-size="10">called in source AST?</text>
    <text x="14" y="148" fill="#fbbf24" font-family="sans-serif" font-size="9" font-weight="600">↳ Unreachable = False Positive</text>
    <text x="14" y="162" fill="#fb7185" font-family="sans-serif" font-size="9" font-weight="600">↳ Reachable = Actionable Threat</text>
  </g>

  <!-- Branch 3A: Unreachable False Positive (Bottom Left) -->
  <path d="M 265 410 L 210 410" stroke="#f59e0b" stroke-width="2" marker-end="url(#wf-arrow)"/>
  <g transform="translate(40, 325)" filter="url(#shadow)">
    <rect width="165" height="155" rx="10" fill="url(#card-grad)" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="14" y="14" width="115" height="20" rx="4" fill="#78350f"/>
    <text x="71" y="28" fill="#fbbf24" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">FALSE POSITIVE</text>
    <text x="14" y="53" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="700">.vexa-sca Policy</text>
    <text x="14" y="70" fill="#94a3b8" font-family="sans-serif" font-size="9">Declare accepted risk:</text>
    <rect x="10" y="78" width="145" height="52" rx="4" fill="#0b0f19"/>
    <text x="14" y="93" fill="#64748b" font-family="monospace" font-size="7">ignore: CVE-2021-xxxx</text>
    <text x="14" y="105" fill="#64748b" font-family="monospace" font-size="7">reason: "Unreachable"</text>
    <text x="14" y="117" fill="#fb7185" font-family="monospace" font-size="7">expires: 2026-12-31</text>
    <text x="14" y="145" fill="#34d399" font-family="sans-serif" font-size="8">Audit-compliant suppression</text>
  </g>

  <!-- Branch 3B: Reachable Vulnerability (Bottom Right) -->
  <path d="M 475 410 L 530 410" stroke="#f43f5e" stroke-width="2" marker-end="url(#wf-arrow-red)"/>
  <g transform="translate(535, 255)" filter="url(#shadow)">
    <rect width="385" height="225" rx="10" fill="url(#card-grad)" stroke="#f43f5e" stroke-width="1.5"/>
    <rect x="14" y="14" width="125" height="20" rx="4" fill="#881337"/>
    <text x="76" y="28" fill="#fb7185" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">ACTIONABLE THREAT</text>
    <text x="14" y="53" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700">Automated Fix &amp; PR Workflow (vexa-sca fix)</text>

    <!-- Substeps -->
    <g transform="translate(14, 68)">
      <rect width="357" height="32" rx="4" fill="#0b0f19"/>
      <text x="10" y="20" fill="#38bdf8" font-family="monospace" font-size="8">1. vexa-sca fix --dry-run</text>
      <text x="180" y="20" fill="#94a3b8" font-family="sans-serif" font-size="8">Preview direct &amp; transitive patches</text>
    </g>
    <g transform="translate(14, 106)">
      <rect width="357" height="32" rx="4" fill="#0b0f19"/>
      <text x="10" y="20" fill="#34d399" font-family="monospace" font-size="8">2. vexa-sca fix --create-pr</text>
      <text x="180" y="20" fill="#94a3b8" font-family="sans-serif" font-size="8">Automated git branch &amp; GitHub PR</text>
    </g>
    <g transform="translate(14, 144)">
      <rect width="357" height="32" rx="4" fill="#0b0f19"/>
      <text x="10" y="20" fill="#fbbf24" font-family="monospace" font-size="8">3. npm test / cargo test</text>
      <text x="180" y="20" fill="#94a3b8" font-family="sans-serif" font-size="8">Verify zero functional regressions</text>
    </g>
    <g transform="translate(14, 182)">
      <rect width="357" height="32" rx="4" fill="#0b0f19"/>
      <text x="10" y="20" fill="#10b981" font-family="monospace" font-size="8">4. Merge Fix PR</text>
      <text x="180" y="20" fill="#34d399" font-family="sans-serif" font-size="8">Pipeline re-runs and exits 0 (clean)</text>
    </g>
  </g>
</svg>
