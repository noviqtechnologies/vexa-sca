[package]
name = "vexa-sca"
version = "1.0.0"
edition = "2021"
authors = ["Vexa"]
description = "Vexa SCA - Software Composition Analysis & Security Engine (High-Performance Rust Core)"
license = "Apache-2.0"
default-run = "vexa-sca"

[lib]
name = "vexa_sca"
path = "src/lib.rs"

[[bin]]
name = "vexa-sca"
path = "src/bin/vexa_sca.rs"

[[bin]]
name = "vexa"
path = "src/main.rs"

[[bin]]
name = "sca"
path = "src/bin/sca.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time"] }
clap = { version = "4", features = ["derive"] }
semver = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
regex = "1.10"
walkdir = "2.5"
toml = "0.8"
colored = "2.1"
tar = "0.4"
flate2 = "1.0"
# Real JS/TS AST parser — replaces regex-only reachability analysis for JS/TS/JSX/TSX.
# All versions pinned to the same oxc monorepo release for API compatibility.
oxc_allocator = "0.155.0"
oxc_parser    = "0.155.0"
oxc_ast       = "0.155.0"
oxc_span      = "0.155.0"
oxc_ast_visit = "0.155.0"
