name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    name: Test & Verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Install pinned pnpm & validator dependencies
        run: |
          npm install -g pnpm@9.15.4
          npm install

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - name: Cargo Cache
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Clippy linter
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Check compilation
        run: cargo check --locked --all-targets

      - name: Run test suite (with real pnpm & npm rollback verification)
        env:
          GITHUB_STEP_SUMMARY: ""
        run: cargo test --locked --all-targets --verbose

      - name: Build release binary
        run: cargo build --locked --release

      - name: Validate generated reports against pinned schemas (SARIF 2.1.0, CycloneDX 1.5, SPDX 2.3)
        env:
          GITHUB_STEP_SUMMARY: ""
        run: npm run validate:schemas
