name: Release & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # -------------------------------------------------------------
  # Job 1: Build cross-platform binary releases
  # -------------------------------------------------------------
  build-release-binaries:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: vexa-sca-linux-x86_64.tar.gz
            use_cross: false

          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_name: vexa-sca-linux-x86_64-musl.tar.gz
            use_cross: false

          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: vexa-sca-darwin-x86_64.tar.gz
            use_cross: false

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: vexa-sca-darwin-arm64.tar.gz
            use_cross: false

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: vexa-sca-windows-x86_64.zip
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux musl only)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Linux/macOS archives
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/vexa-sca dist/
          cp target/${{ matrix.target }}/release/vexa dist/
          cp target/${{ matrix.target }}/release/sca dist/
          cp README.md LICENSE dist/
          tar -czvf ${{ matrix.artifact_name }} -C dist .
          shasum -a 256 ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256

      - name: Package Windows zip
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/vexa-sca.exe dist/
          cp target/${{ matrix.target }}/release/vexa.exe dist/
          cp target/${{ matrix.target }}/release/sca.exe dist/
          cp README.md LICENSE dist/
          7z a -tzip ${{ matrix.artifact_name }} ./dist/*
          shasum -a 256 ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}
            ${{ matrix.artifact_name }}.sha256

  # -------------------------------------------------------------
  # Job 2: Create GitHub Release with all compiled assets
  # -------------------------------------------------------------
  publish-github-release:
    name: Publish GitHub Release
    needs: build-release-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate Release Notes & Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Vexa SCA ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            artifacts/*

  # -------------------------------------------------------------
  # Job 3: Build & Publish Container Image to GitHub Packages (GHCR)
  # -------------------------------------------------------------
  publish-ghcr-docker:
    name: Build & Push Docker Image (GHCR)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
