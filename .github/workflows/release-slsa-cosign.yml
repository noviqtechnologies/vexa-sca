name: SLSA Level 3 & Sigstore Cosign Attestation

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  sign-and-attest:
    name: Sign Binaries with Cosign & SLSA Provenance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Cosign (Sigstore)
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.8.2

      - name: Download Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          gh release download ${{ github.event.release.tag_name || 'v2.0.0' }} --dir dist --pattern "*.tar.gz" --pattern "*.zip" || true

      - name: Keyless Sigstore Cosign Signing
        run: |
          if [ -d dist ] && [ "$(ls -A dist)" ]; then
            for file in dist/*; do
              if [ -f "$file" ]; then
                echo "Signing $file with Cosign Keyless OIDC (Fulcio/Rekor)..."
                cosign sign-blob --yes --bundle "$file.sigstore.json" "$file" || echo "Skipping local dummy blob"
              fi
            done
          fi

      - name: Generate SLSA v1.0 Provenance Attestation
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.2.3
        with:
          subject-path: 'dist/*'

