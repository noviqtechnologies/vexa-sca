name: SLSA Level 3 & Sigstore Cosign Attestation

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  sign-and-attest:
    name: Sign Binaries with Cosign & SLSA Provenance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Cosign (Sigstore)
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.8.2

      - name: Download Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          gh release download ${{ github.event.release.tag_name || 'v2.0.0' }} --dir dist --pattern "*.tar.gz" --pattern "*.zip" || true

      - name: Keyless Sigstore Cosign Signing (Fail-Closed)
        run: |
          if [ ! -d dist ] || [ -z "$(ls -A dist)" ]; then
            echo "::error::No release artifacts downloaded to sign; failing closed."
            exit 1
          fi
          for file in dist/*; do
            if [ -f "$file" ]; then
              echo "Signing $file with Cosign Keyless OIDC (Fulcio/Rekor)..."
              cosign sign-blob --yes --bundle "$file.sigstore.json" "$file"
            fi
          done

      - name: Sign Artifacts with Pinned Ed25519 Release Key (Zero-Dependency Verifier)
        env:
          VEXA_RELEASE_SIGNING_KEY_PEM: ${{ secrets.VEXA_RELEASE_SIGNING_KEY_PEM }}
        run: |
          if [ -z "${VEXA_RELEASE_SIGNING_KEY_PEM:-}" ]; then
            echo "VEXA_RELEASE_SIGNING_KEY_PEM not configured; skipping optional Ed25519 signing."
            exit 0
          fi
          printf '%s\n' "$VEXA_RELEASE_SIGNING_KEY_PEM" > /tmp/vexa-sca-release-key.pem
          chmod 600 /tmp/vexa-sca-release-key.pem
          for file in dist/*.tar.gz dist/*.zip; do
            if [ -f "$file" ]; then
              openssl pkeyutl -sign -inkey /tmp/vexa-sca-release-key.pem \
                -rawin -in "$file" -out "$file.ed25519.sig"
            fi
          done
          rm -f /tmp/vexa-sca-release-key.pem

      - name: Generate SLSA v1.0 Provenance Attestation
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.2.3
        with:
          subject-path: 'dist/*'

